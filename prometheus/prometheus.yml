global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: devopshub-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8080
        labels:
          application: devopshub
          environment: production
