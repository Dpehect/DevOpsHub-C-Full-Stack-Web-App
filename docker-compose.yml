services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devopshub
      POSTGRES_USER: devopshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - devopshub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopshub -d devopshub"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: postgresql
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=devopshub;Username=devopshub;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: DevOpsHub
      Jwt__Audience: DevOpsHub.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__AccessTokenMinutes: 15
      Jwt__RefreshTokenDays: 14
      Cors__Origins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dotnet -e \"new System.Net.Http.HttpClient().GetStringAsync(\\\"http://localhost:8080/health/ready\\\").GetAwaiter().GetResult();\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  devopshub-postgres:
