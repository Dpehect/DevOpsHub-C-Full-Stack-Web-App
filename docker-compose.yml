services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/devopshub.db
      Jwt__Secret: ${JWT_SECRET:-devopshub-local-demo-secret-change-before-production}
      Cors__Origins__0: http://localhost:3000
    volumes:
      - devopshub-data:/app/data
      - devopshub-logs:/app/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  devopshub-data:
  devopshub-logs:
